<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>らくらく血圧記録</title>
    <style>
        :root {
            --primary-color: #ff6b6b;
            --morning-color: #e67e22;
            --evening-color: #2980b9;
            --bg-color: #f8f9fa;
        }

        body {
            font-family: 'Helvetica Neue', Arial, 'Hiragino Kaku Gothic ProN', 'Hiragino Sans', Meiryo, sans-serif;
            background-color: var(--bg-color);
            margin: 0;
            padding: 10px;
            color: #333;
            user-select: none;
        }

        .container {
            max-width: 600px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 20px;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1);
        }

        .header-area {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 15px;
        }

        h1 {
            font-size: 26px;
            color: #2c3e50;
            margin: 0;
        }

        /* 印刷ボタン */
        .print-app-btn {
            background-color: #7f8c8d;
            color: white;
            border: none;
            padding: 10px 20px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }
        .print-app-btn:active {
            background-color: #95a5a6;
        }

        /* 📅 印刷範囲指定の入力欄デザイン */
        .print-range-box {
            background-color: #f1f2f6;
            border: 2px dashed #7f8c8d;
            border-radius: 15px;
            padding: 12px;
            margin-bottom: 15px;
        }
        .print-range-title {
            font-size: 16px;
            font-weight: bold;
            color: #2c3e50;
            margin-bottom: 8px;
            text-align: center;
        }
        .print-inputs {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
        }
        .print-inputs input[type="date"] {
            font-size: 16px;
            padding: 6px;
            border: 2px solid #ccc;
            border-radius: 8px;
            font-family: inherit;
        }
        .print-wave {
            font-size: 18px;
            font-weight: bold;
        }

        /* ☁️ 同期状態インジケーター */
        .sync-status {
            background: #e8f8f5;
            color: #2ecc71;
            padding: 10px;
            border-radius: 12px;
            font-size: 16px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            border: 2px solid #2ecc71;
            transition: all 0.3s;
        }
        .sync-status.loading {
            background: #fdf2e9;
            color: #e67e22;
            border-color: #e67e22;
        }
        .sync-status.error {
            background: #fce4d6;
            color: #c0392b;
            border-color: #c0392b;
        }

        /* カレンダー部分 */
        .calendar-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .calendar-header button {
            background: #e0e0e0;
            border: none;
            padding: 10px 20px;
            font-size: 20px;
            font-weight: bold;
            border-radius: 10px;
            cursor: pointer;
        }

        #monthTitle {
            font-size: 24px;
            font-weight: bold;
        }

        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 6px;
            text-align: center;
        }

        .weekday {
            font-size: 18px;
            font-weight: bold;
            color: #7f8c8d;
            padding: 5px 0;
        }

        .day-cell {
            background: #f1f2f6;
            border-radius: 10px;
            min-height: 90px;
            padding: 6px;
            display: flex;
            flex-direction: column;
            justify-content: flex-start;
            cursor: pointer;
            border: 3px solid transparent;
            transition: all 0.2s;
        }

        .day-cell:active {
            transform: scale(0.95);
        }

        .day-cell.selected {
            border-color: var(--primary-color);
            background: #fff0f0;
        }

        .day-cell.today {
            background: #ffeaa7;
        }

        .day-num {
            font-size: 20px;
            font-weight: bold;
            text-align: left;
            margin-bottom: 4px;
        }

        /* ★ 血圧表示をめちゃくちゃ大きく、見やすく修正 */
        .cell-data {
            font-size: 15px;
            text-align: center;
            line-height: 1.3;
            font-family: 'Arial Black', sans-serif;
        }

        .cell-morning { color: var(--morning-color); font-weight: bold; margin-bottom: 2px;}
        .cell-evening { color: var(--evening-color); font-weight: bold; }

        /* 入力フォーム部分 */
        .input-section {
            margin-top: 25px;
            border-top: 4px dashed #ddd;
            padding-top: 20px;
        }

        .input-title {
            font-size: 22px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 15px;
            color: #2c3e50;
        }

        .time-box-container {
            display: flex;
            gap: 15px;
            margin-bottom: 20px;
        }

        .time-box {
            flex: 1;
            border-radius: 15px;
            padding: 15px;
            box-shadow: 0 2px 5px rgba(0,0,0,0.05);
        }

        .time-box.morning { background-color: #fff5eb; border: 2px solid var(--morning-color); }
        .time-box.evening { background-color: #f0f7ff; border: 2px solid var(--evening-color); }

        .time-title {
            font-size: 20px;
            font-weight: bold;
            text-align: center;
            margin-bottom: 10px;
        }
        .morning .time-title { color: #d35400; }
        .evening .time-title { color: #2980b9; }

        .input-group {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .input-group label {
            font-size: 18px;
            font-weight: bold;
        }

        .input-group input {
            width: 80px;
            font-size: 24px;
            padding: 5px;
            text-align: center;
            border: 2px solid #ccc;
            border-radius: 8px;
        }

        .save-btn {
            display: block;
            width: 100%;
            background-color: #2ecc71;
            color: white;
            border: none;
            padding: 15px;
            font-size: 26px;
            font-weight: bold;
            border-radius: 15px;
            cursor: pointer;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        .save-btn:active {
            background-color: #27ae60;
            transform: translateY(2px);
        }

        /* 警告用オーバーレイ */
        .alert-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #ff4757;
            color: white;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            text-align: center;
            padding: 20px;
            box-sizing: border-box;
        }

        .alert-overlay h2 {
            font-size: 45px;
            margin-bottom: 20px;
            line-height: 1.4;
            animation: pulse 1.5s infinite;
        }

        .alert-overlay p {
            font-size: 22px;
            margin-bottom: 40px;
        }

        .alert-overlay button {
            background-color: white;
            color: #ff4757;
            border: none;
            padding: 20px 50px;
            font-size: 28px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.3);
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.05); }
            100% { transform: scale(1); }
        }

        .hidden {
            display: none !important;
        }

        /* 🖨️ 印刷用のエクセル風・質素なデザイン（A4サイズ縦） */
        #printTableContainer {
            display: none;
        }

        @media print {
            @page {
                size: A4 portrait;
                margin: 15mm;
            }
            body {
                background: white;
                color: black;
                padding: 0;
            }
            .container, .alert-overlay, .sync-status {
                display: none !important;
            }
            #printTableContainer {
                display: block !important;
            }
            .excel-table {
                width: 100%;
                border-collapse: collapse;
                margin-top: 10px;
            }
            .excel-table th, .excel-table td {
                border: 1px solid #333;
                padding: 8px;
                text-align: center;
                font-size: 14px;
            }
            .excel-table th {
                background-color: #f2f2f2;
                font-weight: bold;
            }
            .print-title {
                font-size: 22px;
                font-weight: bold;
                text-align: center;
                margin-bottom: 5px;
            }
            .print-subtitle {
                font-size: 12px;
                text-align: right;
                margin-bottom: 15px;
            }
        }
    </style>
</head>
<body>

    <div id="alertScreen" class="alert-overlay hidden">
        <h2>⚠️<br>血圧を測ってください！</h2>
        <p>きょうはまだ一回も記録されていませんよ。</p>
        <button onclick="dismissAlert()">いまから記録する</button>
    </div>

    <div class="container">
        <div class="header-area">
            <h1> らくらく血圧ノート</h1>
            <button class="print-app-btn" onclick="openPrintWindow()">🖨️ 印刷する</button>
        </div>

        <div class="print-range-box">
            <div class="print-range-title">🖨️ 印刷する日にちの範囲</div>
            <div class="print-inputs">
                <input type="date" id="printStartDate">
                <span class="print-wave">〜</span>
                <input type="date" id="printEndDate">
            </div>
        </div>

        <div id="syncStatus" class="sync-status loading">🔄 Googleからデータを読み込み中...</div>

        <div class="calendar-header">
            <button onclick="changeMonth(-1)">◀ 前の月</button>
            <div id="monthTitle">2026年 5月</div>
            <button onclick="changeMonth(1)">次の月 ▶</button>
        </div>

        <div class="calendar-grid" id="calendarGrid">
        </div>

        <div class="input-section">
            <div class="input-title" id="selectedDateTitle">選択された日付</div>
            
            <div class="time-box-container">
                <div class="time-box morning">
                    <div class="time-title">☀️ 朝</div>
                    <div class="input-group">
                        <label>上</label>
                        <input type="number" id="morningSys" placeholder="---" pattern="\d*">
                    </div>
                    <div class="input-group">
                        <label>下</label>
                        <input type="number" id="morningDia" placeholder="---" pattern="\d*">
                    </div>
                </div>

                <div class="time-box evening">
                    <div class="time-title">🌙 夜</div>
                    <div class="input-group">
                        <label>上</label>
                        <input type="number" id="eveningSys" placeholder="---" pattern="\d*">
                    </div>
                    <div class="input-group">
                        <label>下</label>
                        <input type="number" id="eveningDia" placeholder="---" pattern="\d*">
                    </div>
                </div>
            </div>

            <button class="save-btn" onclick="saveData()">しっかりと保存する</button>
        </div>
    </div>

    <div id="printTableContainer">
        <div class="print-title" id="printTargetMonth">血圧きろく表</div>
        <div class="print-subtitle">氏名：______________________</div>
        <table class="excel-table">
            <thead>
                <tr>
                    <th style="width: 20%;">日付</th>
                    <th style="width: 40%;">☀️ 朝 (上 / 下)</th>
                    <th style="width: 40%;">🌙 夜 (上 / 下)</th>
                </tr>
            </thead>
            <tbody id="printTableBody">
            </tbody>
        </table>
    </div>

    <script>
        // 🛠️ Google Apps Script (GAS) のエンドポイントURL
        const GAS_URL = "https://script.google.com/macros/s/AKfycby8LLAf7Bs6H6ZG95OsPfD_Rox-EZidQaGrkqwb_oq5pAp8njLParcjlxpPYukwc0Nywg/exec";

        // 状態管理
        let currentDate = new Date();
        let selectedDateStr = getFormattedDate(new Date());
        
        let bpData = JSON.parse(localStorage.getItem('bpData_v2')) || {};

        const weekdays = ['日', '月', '火', '水', '木', '金', '土'];

        window.onload = function() {
            setDefaultPrintRange();
            renderCalendar();
            selectDate(selectedDateStr);
            // Googleから最新データをダウンロード
            loadDataFromGoogle();
        };

        function setDefaultPrintRange() {
            const y = currentDate.getFullYear();
            const m = currentDate.getMonth();
            const firstDay = new Date(y, m, 1);
            const lastDay = new Date(y, m + 1, 0);
            
            document.getElementById('printStartDate').value = getFormattedDate(firstDay);
            document.getElementById('printEndDate').value = getFormattedDate(lastDay);
        }

        // 📅 【変更点】古いキャッシュを完全に無視して、常にGoogleの最新スプレッドシートを読み込むように修正
        async function loadDataFromGoogle() {
            updateSyncStatus('loading', '🔄 Googleから最新データを読み込み中...');
            try {
                // URLの末尾に毎回違う数字（タイムスタンプ）をくっつけることで、Googleのキャッシュを強制回避します
                const cacheBusterUrl = GAS_URL + (GAS_URL.includes('?') ? '&' : '?') + '_=' + new Date().getTime();
                
                const response = await fetch(cacheBusterUrl, { 
                    method: 'GET', 
                    mode: 'cors',
                    cache: 'no-store' // ブラウザ側にも「古いデータを使い回すな」と命令します
                });
                
                if (!response.ok) throw new Error('ネットワークエラー');
                
                const remoteData = await response.json();
                
                if (remoteData && typeof remoteData === 'object') {
                    bpData = remoteData;
                    localStorage.setItem('bpData_v2', JSON.stringify(bpData)); // LocalStorageにも同期
                    updateSyncStatus('success', '☁️ Googleと自動同期が完了しています');
                } else {
                    updateSyncStatus('success', '☁️ データがまだありません（同期OK）');
                }
            } catch (error) {
                console.error(error);
                updateSyncStatus('error', '⚠️ Googleとの同期に失敗しました（スマホにのみ保存中）');
            }

            checkTodayMeasurement();
            renderCalendar();
            selectDate(selectedDateStr);
        }

        function updateSyncStatus(status, text) {
            const el = document.getElementById('syncStatus');
            el.className = 'sync-status ' + status;
            el.textContent = text;
        }

        function checkTodayMeasurement() {
            const todayStr = getFormattedDate(new Date());
            const todayData = bpData[todayStr];
            if (!todayData || (!todayData.mSys && !todayData.eSys)) {
                document.getElementById('alertScreen').classList.remove('hidden');
            }
        }

        function dismissAlert() {
            document.getElementById('alertScreen').classList.add('hidden');
            selectedDateStr = getFormattedDate(new Date());
            currentDate = new Date();
            renderCalendar();
            selectDate(selectedDateStr);
        }

        function getFormattedDate(date) {
            const y = date.getFullYear();
            const m = String(date.getMonth() + 1).padStart(2, '0');
            const d = String(date.getDate()).padStart(2, '0');
            return `${y}-${m}-${d}`;
        }

        function renderCalendar() {
            const year = currentDate.getFullYear();
            const month = currentDate.getMonth();

            document.getElementById('monthTitle').textContent = `${year}年 ${month + 1}月`;

            const grid = document.getElementById('calendarGrid');
            grid.innerHTML = '';

            weekdays.forEach(day => {
                const dayHeader = document.createElement('div');
                dayHeader.className = 'weekday';
                dayHeader.textContent = day;
                grid.appendChild(dayHeader);
            });

            const firstDayIndex = new Date(year, month, 1).getDay();
            const totalDays = new Date(year, month + 1, 0).getDate();

            for (let i = 0; i < firstDayIndex; i++) {
                grid.appendChild(document.createElement('div'));
            }

            for (let day = 1; day <= totalDays; day++) {
                const targetDate = new Date(year, month, day);
                const dateStr = getFormattedDate(targetDate);

                const cell = document.createElement('div');
                cell.className = 'day-cell';
                if (dateStr === getFormattedDate(new Date())) cell.classList.add('today');
                if (dateStr === selectedDateStr) cell.classList.add('selected');
                cell.onclick = () => selectDate(dateStr);

                const numDiv = document.createElement('div');
                numDiv.className = 'day-num';
                numDiv.textContent = day;
                cell.appendChild(numDiv);

                const dataDiv = document.createElement('div');
                dataDiv.className = 'cell-data';
                
                if (bpData[dateStr]) {
                    const d = bpData[dateStr];
                    if (d.mSys && d.mDia) {
                        dataDiv.innerHTML += `<div class="cell-morning">☀️${d.mSys}/${d.mDia}</div>`;
                    }
                    if (d.eSys && d.eDia) {
                        dataDiv.innerHTML += `<div class="cell-evening">🌙${d.eSys}/${d.eDia}</div>`;
                    }
                }
                cell.appendChild(dataDiv);
                grid.appendChild(cell);
            }
        }

        function renderPrintTable() {
            const startVal = document.getElementById('printStartDate').value;
            const endVal = document.getElementById('printEndDate').value;

            if (!startVal || !endVal) {
                alert("印刷する日付の「始まり」と「終わり」を正しく選んでくださいね。");
                return false;
            }

            const start = new Date(startVal);
            const end = new Date(endVal);

            if (start > end) {
                alert("日付の「始まり」が「終わり」よりも先の日付になっていますよ。");
                return false;
            }

            const startFormat = `${start.getFullYear()}年${start.getMonth()+1}月${start.getDate()}日`;
            const endFormat = `${end.getFullYear()}年${end.getMonth()+1}月${end.getDate()}日`;
            document.getElementById('printTargetMonth').textContent = `${startFormat} 〜 ${endFormat} 血圧きろく表`;

            const printBody = document.getElementById('printTableBody');
            printBody.innerHTML = '';

            let currentLoopDate = new Date(start);
            while (currentLoopDate <= end) {
                const dateStr = getFormattedDate(currentLoopDate);
                let mText = "ー";
                let eText = "ー";

                if (bpData[dateStr]) {
                    const d = bpData[dateStr];
                    if (d.mSys && d.mDia) mText = `${d.mSys} / ${d.mDia}`;
                    if (d.eSys && d.eDia) eText = `${d.eSys} / ${d.eDia}`;
                }

                const m = currentLoopDate.getMonth() + 1;
                const d = currentLoopDate.getDate();
                const w = weekdays[currentLoopDate.getDay()];

                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td>${m}月${d}日 (${w})</td>
                    <td>${mText}</td>
                    <td>${eText}</td>
                `;
                printBody.appendChild(tr);

                currentLoopDate.setDate(currentLoopDate.getDate() + 1);
            }
            return true;
        }

        function openPrintWindow() {
            if (renderPrintTable()) {
                window.print();
            }
        }

        function changeMonth(direction) {
            currentDate.setMonth(currentDate.getMonth() + direction);
            renderCalendar();
            setDefaultPrintRange();
        }

        function selectDate(dateStr) {
            selectedDateStr = dateStr;
            renderCalendar();

            const dateObj = new Date(dateStr);
            document.getElementById('selectedDateTitle').textContent = 
                `📝 ${dateObj.getFullYear()}年${dateObj.getMonth()+1}月${dateObj.getDate()}日のきろく`;

            if (bpData[dateStr]) {
                document.getElementById('morningSys').value = bpData[dateStr].mSys || '';
                document.getElementById('morningDia').value = bpData[dateStr].mDia || '';
                document.getElementById('eveningSys').value = bpData[dateStr].eSys || '';
                document.getElementById('eveningDia').value = bpData[dateStr].eDia || '';
            } else {
                document.getElementById('morningSys').value = '';
                document.getElementById('morningDia').value = '';
                document.getElementById('eveningSys').value = '';
                document.getElementById('eveningDia').value = '';
            }
        }

        async function saveData() {
            const mSys = document.getElementById('morningSys').value;
            const mDia = document.getElementById('morningDia').value;
            const eSys = document.getElementById('eveningSys').value;
            const eDia = document.getElementById('eveningDia').value;

            if (!mSys && !mDia && !eSys && !eDia) {
                delete bpData[selectedDateStr];
            } else {
                bpData[selectedDateStr] = { mSys, mDia, eSys, eDia };
            }

            localStorage.setItem('bpData_v2', JSON.stringify(bpData));
            renderCalendar();

            updateSyncStatus('loading', '⏳ Googleスプレッドシートに保存中...');
            
            try {
                const response = await fetch(GAS_URL, {
                    method: 'POST',
                    mode: 'cors',
                    headers: {
                        'Content-Type': 'text/plain'
                    },
                    body: JSON.stringify(bpData)
                });

                if (!response.ok) throw new Error('送信エラー');
                
                const result = await response.json();
                if (result.status === 'success') {
                    updateSyncStatus('success', '☁️ Googleと自動同期が完了しています');
                    alert('しっかりと保存しました！');
                } else {
                    throw new Error(result.message);
                }
            } catch (error) {
                console.error(error);
                updateSyncStatus('error', '⚠️ Googleへの保存に失敗しました。あとで再接続します。');
                alert('スマホ内には保存されましたが、Googleへの保存に失敗しました。電波の良いところで再度お試しください。');
            }
        }
    </script>
</body>
</html>
